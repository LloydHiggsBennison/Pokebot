services:
  - type: web
    name: pokebot
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && node scripts/download-sprites.js
    startCommand: npm start
    healthCheckPath: /
    nodeVersion: 22.x
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NODE_ENV
        value: production
